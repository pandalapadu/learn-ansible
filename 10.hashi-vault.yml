- name: Hashicorp Vault connect
  hosts: localhost
  connection: local
  vars:
    ansible_python_interpreter: /usr/bin/python3.12   # Ensure Ansible uses Python 3.12
  tasks:
    - name: Read password from Vault
      ansible.builtin.debug:
        msg: >-
          {{
            lookup(
              'community.hashi_vault.hashi_vault',
              'secret=demo-ssh/data/venkat:password',
              token=vault_token,
              url='http://vault.azdevopsvenkat.site:8200'
            )
          }}